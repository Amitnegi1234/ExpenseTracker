
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="form-container">
            <h1>Login</h1>

            <form id="loginForm">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                        placeholder="Enter your password" required>
                </div>

                <p id="errorMessage"></p>
                <button type="submit">Login</button>
            </form>

            <!-- Forgot Password -->
            <p>
                <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </p>

            <!-- Forgot Password Form (hidden initially) -->
            <form id="forgotPasswordForm" style="display: none;">
                <h3>Reset Password</h3>

                <div>
                    <label for="forgotEmail">Enter your email</label>
                    <input type="email" id="forgotEmail"
                        placeholder="Enter registered email" required>
                </div>

                <p id="forgotMessage"></p>

                <button type="submit">Send Email</button>
            </form>

            <p class="switch-page">
                Don't have an account?
                <a href="../signup/index.html">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
